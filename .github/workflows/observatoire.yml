name: Observatoire Tech IA Gaming

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-depot
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier la syntaxe Python et les fichiers JSON
        run: |
          python -m compileall -q main.py agent_gardien.py gouvernement.py tests
          python -m unittest discover -s tests -v
          python -c "import json; json.load(open('themes.json', encoding='utf-8')); json.load(open('site/articles.json', encoding='utf-8')); print('JSON et Python OK')"
          test -f index.html
          test -f site/index.html

      - name: Initialiser et sauvegarder le gouvernement virtuel
        run: python gouvernement.py

      - name: Générer la publication
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          HF_MODEL: ${{ vars.HF_MODEL || 'Qwen/Qwen2.5-7B-Instruct' }}
        run: python main.py

      - name: Enregistrer les publications et archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in site/articles.json site/audio data/gouvernement.json site/data/gouvernement.json memoire_tech.txt .theme-index journal_conformite_legale.txt; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Publier les nouvelles actualités"
            git pull --rebase origin main
            git push
          else
            echo "Aucun changement à publier."
          fi
