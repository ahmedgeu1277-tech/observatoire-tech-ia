name: Tests automatiques et contrôle qualité

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q .
      - name: Exécuter les tests
        run: python -m unittest discover -s tests -v
          python healthcheck.py
      - name: Valider les fichiers JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path("themes.json"), Path("site/articles.json")]:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"OK : {path}")
          for path in Path("agents_dynamiques").glob("*.json"):
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"OK : {path}")
          PY
      - name: Vérifier les fichiers indispensables
        run: |
          test -s main.py
          test -s agent_gardien.py
          test -s requirements.txt
          test -s index.html
          test -s site/index.html
          test -s site/documentaire-test.html
