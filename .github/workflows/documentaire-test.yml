name: Documentaire test (publication temporaire)

on:
  push:
    branches: [main]
    paths:
      - "documentaire_test.py"
      - "ai_providers.py"
      - ".github/workflows/documentaire-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-depot
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Vérifier le code et les tests
        run: |
          python -m compileall -q documentaire_test.py nettoyer_documentaire_test.py agent_gardien.py tests
          python -m unittest discover -s tests -v
      - name: Vérifier la présence d'au moins un fournisseur IA
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$HF_API_KEY" ] && [ -z "$HF_TOKEN" ]; then
            echo "::error::Configure GROQ_API_KEY ou HF_API_KEY/HF_TOKEN."
            exit 1
          fi
      - name: Générer le documentaire et sa narration
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          HF_MODEL: ${{ vars.HF_MODEL || 'Qwen/Qwen2.5-7B-Instruct' }}
          AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || 'groq,huggingface' }}
        run: python documentaire_test.py
      - name: Publier sur le site
        run: |
          git config user.name "Usine IA Tech & Gaming"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/documentaire-test.html site/documentaire-test.md site/documentaire-test.json site/audio/
          if git diff --cached --quiet; then
            echo "::error::Aucun fichier de documentaire généré."
            exit 1
          fi
          git commit -m "Publier le documentaire de test pour 24 heures"
          git pull --rebase origin main
          git push
