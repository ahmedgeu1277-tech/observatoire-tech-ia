name: Documentaire test (publication temporaire)

on:
  push:
    branches: [main]
    paths:
      - "documentaire_test.py"
      - "ai_providers.py"
      - ".github/workflows/documentaire-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-depot
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Vérifier le code et les tests
        run: |
          python -m compileall -q documentaire_test.py nettoyer_documentaire_test.py agent_gardien.py tests
          python -m unittest discover -s tests -v
      - name: Vérifier les articles et leurs sources HTTPS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          articles = json.loads(Path("site/articles.json").read_text(encoding="utf-8"))
          themes = {
              article.get("theme")
              for article in articles
              if article.get("theme")
              and article.get("summary")
              and any(
                  isinstance(source, dict) and str(source.get("url", "")).startswith("https://")
                  for source in article.get("sources", [])
              )
          }
          if len(themes) < 4:
              raise SystemExit("Il faut au moins quatre thèmes publiés avec des sources HTTPS.")
          print(f"{len(themes)} thèmes publiés disponibles.")
          PY
      - name: Générer le documentaire compilé et sa narration
        run: python documentaire_test.py
      - name: Publier sur le site
        run: |
          mkdir -p "$RUNNER_TEMP/documentaire-test/site/audio"
          cp site/documentaire-test.html site/documentaire-test.md site/documentaire-test.json "$RUNNER_TEMP/documentaire-test/site/"
          AUDIO_FILE=$(python -c 'import json; print(json.load(open("site/documentaire-test.json", encoding="utf-8"))["audio_file"])')
          cp "site/audio/$AUDIO_FILE" "$RUNNER_TEMP/documentaire-test/site/audio/"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p site/audio
          cp "$RUNNER_TEMP/documentaire-test/site/"*.html "$RUNNER_TEMP/documentaire-test/site/"*.md "$RUNNER_TEMP/documentaire-test/site/"*.json site/
          cp "$RUNNER_TEMP/documentaire-test/site/audio/"* site/audio/
          git config user.name "Usine IA Tech & Gaming"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/documentaire-test.html site/documentaire-test.md site/documentaire-test.json "site/audio/$AUDIO_FILE"
          if git diff --cached --quiet; then
            echo "::error::Aucun fichier de documentaire généré."
            exit 1
          fi
          git commit -m "Publier le documentaire de test pour 24 heures"
          git push origin HEAD:main
