name: Documentaire test (archives 30 jours)

on:
  push:
    branches: [main]
    paths:
      - "documentaire_test.py"
      - "video_documentaire.py"
      - "traduire_documentaire.py"
      - "templates/documentaire.html.tpl"
      - "nettoyer_documentaire_test.py"
      - "requirements.txt"
      - "ai_providers.py"
      - "tests/test_documentaire_et_securite.py"
      - ".github/workflows/documentaire-test.yml"
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-depot
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Les secrets sont injectés uniquement dans ce job de génération, jamais dans les fichiers.
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Vérifier le code et les tests
        run: |
          python -m compileall -q documentaire_test.py traduire_documentaire.py video_documentaire.py nettoyer_documentaire_test.py agent_gardien.py tests
          python -m unittest discover -s tests -v
      - name: Vérifier les articles et leurs sources HTTPS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          articles = json.loads(Path("site/articles.json").read_text(encoding="utf-8"))
          themes = {a.get("theme") for a in articles if isinstance(a, dict) and a.get("theme") and a.get("summary")
                    and any(isinstance(s, dict) and str(s.get("url", "")).startswith("https://") for s in a.get("sources", []))}
          if len(themes) < 4:
              raise SystemExit("Il faut au moins quatre thèmes publiés avec des sources HTTPS.")
          print(f"{len(themes)} thèmes publiés disponibles.")
          PY
      - name: Générer le documentaire et ses médias
        run: python documentaire_test.py
      - name: Préparer la publication sans effacer les archives récentes
        run: |
          mkdir -p "$RUNNER_TEMP/documentaire-test/site/audio" "$RUNNER_TEMP/documentaire-test/site/video" "$RUNNER_TEMP/documentaire-test/site/archives"
          cp site/documentaire-test.html site/documentaire-test.md site/documentaire-test.json "$RUNNER_TEMP/documentaire-test/site/"
          VIDEO_FILE=$(python -c 'import json; print(json.load(open("site/documentaire-test.json", encoding="utf-8"))["video_file"])')
          AUDIO_FILE=$(python -c 'import json; print(json.load(open("site/documentaire-test.json", encoding="utf-8"))["audio_file"])')
          cp "site/video/$VIDEO_FILE" "$RUNNER_TEMP/documentaire-test/site/video/"
          cp "site/audio/$AUDIO_FILE" "$RUNNER_TEMP/documentaire-test/site/audio/"
          python - <<'PY'
          import json, shutil, os
          from pathlib import Path
          manifest = json.loads(Path("site/documentaire-test.json").read_text(encoding="utf-8"))
          target = Path(os.environ["RUNNER_TEMP"]) / "documentaire-test" / "site"
          for item in manifest.get("translations", {}).values():
              for key, folder in (("audio", "audio"), ("video", "video"), ("subtitles", "video")):
                  name = item.get(key)
                  if name:
                      source = Path("site") / folder / name
                      if not source.is_file():
                          raise SystemExit(f"Média traduit absent : {source}")
                      shutil.copy2(source, target / folder / name)
          PY
          cp site/archives/documentaire-test-*.md "$RUNNER_TEMP/documentaire-test/site/archives/"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p site/audio site/video site/archives
          cp "$RUNNER_TEMP/documentaire-test/site/"*.html "$RUNNER_TEMP/documentaire-test/site/"*.md "$RUNNER_TEMP/documentaire-test/site/"*.json site/
          cp "$RUNNER_TEMP/documentaire-test/site/audio/"* site/audio/
          cp "$RUNNER_TEMP/documentaire-test/site/video/"* site/video/
          cp "$RUNNER_TEMP/documentaire-test/site/archives/"* site/archives/
          git config user.name "Usine IA Tech & Gaming"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- site/documentaire-test.html site/documentaire-test.md site/documentaire-test.json site/audio site/video site/archives
          git commit -m "Publier le documentaire et conserver les archives 30 jours"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; echo "::error::Conflit Git pendant le rebase."; exit 1; fi
            if git push origin HEAD:main; then echo "Documentaire publié (tentative $attempt)."; exit 0; fi
            sleep 3
          done
          echo "::error::Publication impossible après cinq tentatives."
          exit 1
