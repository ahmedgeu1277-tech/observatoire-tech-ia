name: Nettoyage des archives documentaires (rétention 30 jours)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-depot
  cancel-in-progress: false

jobs:
  retirer-si-expire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Supprimer uniquement les archives âgées de plus de 30 jours
        run: python nettoyer_documentaire_test.py
      - name: Enregistrer le nettoyage si nécessaire
        run: |
          git config user.name "Usine IA Tech & Gaming"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- site/documentaire-test.html site/documentaire-test.md site/documentaire-test.json site/audio/ site/video/ site/archives/
          if git diff --cached --quiet; then echo "Aucune archive de plus de 30 jours."; exit 0; fi
          git commit -m "Nettoyer les archives documentaires de plus de 30 jours"
          git pull --rebase origin main
          git push
