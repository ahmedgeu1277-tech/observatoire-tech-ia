name: Usine IA Tech & Gaming 24-7

on:
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-depot
  cancel-in-progress: false

jobs:
  generer-et-publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install --disable-pip-version-check -r requirements.txt
      - name: Vérifier la syntaxe et les tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
          python -c "import json; json.load(open('themes.json', encoding='utf-8')); json.load(open('site/articles.json', encoding='utf-8')); print('Fichiers JSON valides')"
      - name: Générer les données de la ville virtuelle
        run: python gouvernement.py
      - name: Générer un article
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          HF_MODEL: ${{ vars.HF_MODEL || 'Qwen/Qwen2.5-7B-Instruct' }}
          AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || 'groq,huggingface' }}
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$HF_API_KEY" ] && [ -z "$HF_TOKEN" ]; then
            echo "::error::Configure au moins un secret IA : GROQ_API_KEY ou HF_API_KEY/HF_TOKEN."
            exit 1
          fi
          python main.py
      - name: Enregistrer le site
        if: success()
        run: |
          git config user.name "Usine IA Tech & Gaming"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p site/audio
          touch journal_conformite_legale.txt
          for path in site/articles.json site/audio data/gouvernement.json memoire_tech.txt .theme-index journal_conformite_legale.txt; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git commit -m "Publication automatique d'un article IA"
          git pull --rebase origin main
          git push
