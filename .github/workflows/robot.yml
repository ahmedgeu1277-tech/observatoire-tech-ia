name: Usine IA Tech & Gaming 24-7
on:
  schedule:
    - cron: '0 9,18 * * *'
    - cron: '0 14 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executer-usine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dependances
        run: pip install yt-dlp groq huggingface_hub edge-tts requests
      - name: Lancer les agents principaux
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
      - name: Publier sur le site
        run: |
          git config --global user.name "Observatoire IA"
          git config --global user.email "bot@github.com"
          git add .
          git commit -m "Publication Labo Tech & Gaming par IA" || exit 0
          git push
