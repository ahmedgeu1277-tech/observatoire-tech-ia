name: Usine IA Tech & Gaming 24-7

on:
  # Lancement manuel de secours ; la publication automatique est gérée par observatoire.yml.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usine-publication
  cancel-in-progress: false

jobs:
  generer-et-publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Vérifier la syntaxe de tous les modules Python
        run: python -m compileall -q .
      - name: Générer un article
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
        run: python main.py
      - name: Enregistrer le site
        if: success()
        run: |
          git config user.name "Usine IA Tech & Gaming"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p site/audio
          touch journal_conformite_legale.txt
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git commit -m "Publication automatique d'un article IA"
          git push
