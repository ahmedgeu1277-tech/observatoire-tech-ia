name: Analyse avancée - sécurité, qualité et site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyse-avancee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite-python:
    name: Qualité Python (Ruff et Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Installer les analyseurs
        run: python -m pip install --disable-pip-version-check ruff bandit
      - name: Analyser le style et les erreurs Python
        run: ruff check . --output-format=github --ignore TRY004,ISC004,PERF102,SIM117
      - name: Analyser les risques de sécurité Python
        run: bandit -r . -x ./tests -ll

  secrets:
    name: Recherche de secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scanner l'historique Git et les fichiers
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  codeql:
    name: Analyse de sécurité CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']
    steps:
      - uses: actions/checkout@v6
      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyser le code
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  test-site:
    name: Test navigateur de toutes les pages HTML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Installer Playwright
        run: |
          npm install --prefix /tmp/pw --no-audit --no-fund playwright
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Démarrer le site et tester les pages
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/site-server.log 2>&1 &
          echo $! > /tmp/site-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          function htmlFiles(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              if (entry.name === '.git' || entry.name === 'node_modules') return [];
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) return htmlFiles(full);
              return entry.isFile() && entry.name.toLowerCase().endsWith('.html') ? [full] : [];
            });
          }

          (async () => {
            const files = htmlFiles('.');
            if (!files.length) throw new Error('Aucun fichier HTML trouvé.');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const failures = [];
            page.on('pageerror', error => failures.push('Erreur JavaScript: ' + error.message));

            for (const file of files) {
              const route = '/' + file.split(path.sep).join('/');
              const response = await page.goto('http://127.0.0.1:4173' + route, { waitUntil: 'domcontentloaded' });
              if (!response || response.status() >= 400) {
                failures.push(route + ' : HTTP ' + (response ? response.status() : 'aucune réponse'));
              } else {
                const title = await page.title();
                console.log('OK ' + route + ' | ' + (title || 'sans titre'));
                const links = await page.locator('a[href]').evaluateAll(nodes =>
                  nodes.map(node => node.getAttribute('href')).filter(Boolean)
                );
                for (const href of links) {
                  if (href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) continue;
                  const target = new URL(href, page.url());
                  if (target.origin !== 'http://127.0.0.1:4173') continue;
                  const check = await page.request.get(target.href);
                  if (!check.ok()) failures.push(route + ' : lien cassé ' + href + ' (HTTP ' + check.status() + ')');
                }
              }
            }

            // Vérifications fonctionnelles des données et interactions.
            const home = await page.goto('http://127.0.0.1:4173/site/index.html', { waitUntil: 'networkidle' });
            if (!home || !home.ok()) failures.push('Accueil : impossible à charger.');
            const languageSelector = page.locator('#language');
            if (await languageSelector.count() !== 1) {
              failures.push('Accueil : sélecteur de langue absent.');
            } else {
              for (const lang of ['en', 'es', 'de', 'pt', 'ar', 'zh', 'fr']) {
                await languageSelector.selectOption(lang);
                const actual = await page.locator('html').evaluate(el => ({lang: el.lang, dir: el.dir}));
                if (actual.lang !== lang) failures.push('Langue non appliquée : ' + lang);
                const expectedDir = lang === 'ar' ? 'rtl' : 'ltr';
                if (actual.dir !== expectedDir) failures.push('Direction incorrecte pour ' + lang + ' : ' + actual.dir);
              }
              await page.reload({waitUntil: 'networkidle'});
              const savedLang = await page.locator('html').getAttribute('lang');
              if (savedLang !== 'fr') failures.push('Accueil : préférence de langue non mémorisée après rechargement.');
            }
            await page.waitForFunction(() => {
              const status = document.querySelector('#status');
              return status && status.textContent !== 'Chargement…';
            }, { timeout: 10000 }).catch(() => failures.push('Accueil : les actualités ne terminent pas leur chargement.'));
            const articleData = await page.request.get('http://127.0.0.1:4173/site/articles.json');
            if (!articleData.ok()) {
              failures.push('Actualités : site/articles.json inaccessible.');
            } else {
              const articles = await articleData.json();
              const displayed = await page.locator('#articles > .article').count();
              if (displayed !== articles.length) failures.push('Actualités : nombre de cartes affichées différent du nombre d’articles.');
              const statusText = await page.locator('#status').textContent();
              if (!String(statusText).includes(String(articles.length))) failures.push('Actualités : statut affiché incohérent avec le nombre d’articles.');
              for (const article of articles) {
                if (!article.audio_url) continue;
                let audioPath = String(article.audio_url).replace(/^\.\//, '');
                if (audioPath.startsWith('site/')) audioPath = audioPath.slice(5);
                const audioResponse = await page.request.get('http://127.0.0.1:4173/site/' + audioPath);
                if (!audioResponse.ok()) failures.push('Audio inaccessible : ' + audioPath + ' (HTTP ' + audioResponse.status() + ')');
              }
            }

            // Le documentaire propose les mêmes sept langues pour ses libellés d'interface.
            const documentary = await page.goto('http://127.0.0.1:4173/site/documentaire-test.html', { waitUntil: 'domcontentloaded' });
            if (!documentary || !documentary.ok()) {
              failures.push('Documentaire : impossible à charger.');
            } else {
              const documentarySelector = page.locator('#language');
              if (await documentarySelector.count() !== 1) {
                failures.push('Documentaire : sélecteur de langue absent.');
              } else {
                for (const lang of ['en', 'es', 'de', 'pt', 'ar', 'zh', 'fr']) {
                  await documentarySelector.selectOption(lang);
                  const actual = await page.locator('html').evaluate(el => ({lang: el.lang, dir: el.dir}));
                  if (actual.lang !== lang) failures.push('Documentaire : langue non appliquée : ' + lang);
                  const expectedDir = lang === 'ar' ? 'rtl' : 'ltr';
                  if (actual.dir !== expectedDir) failures.push('Documentaire : direction incorrecte pour ' + lang);
                }
                await documentarySelector.selectOption('ar');
                await page.reload({waitUntil: 'domcontentloaded'});
                const saved = await page.locator('html').evaluate(el => ({lang: el.lang, dir: el.dir}));
                if (saved.lang !== 'ar' || saved.dir !== 'rtl') failures.push('Documentaire : préférence arabe non mémorisée après rechargement.');
                const headings = await page.locator('.sources-heading').allTextContents();
                if (headings.length !== 4 || headings.some(text => text !== 'المصادر')) failures.push('Documentaire : tous les libellés des sources ne sont pas traduits.');
              }
            }

            // La ville est volontairement retirée du site public : elle ne doit pas exposer
            // son état interne tant qu'un backend privé avec authentification n'existe pas.
            const privateCity = await page.request.get('http://127.0.0.1:4173/site/ville-virtuelle.html');
            if (privateCity.status() !== 404) failures.push('Sécurité : la ville virtuelle ne doit pas être accessible publiquement.');
            const privateState = await page.request.get('http://127.0.0.1:4173/site/data/gouvernement.json');
            if (privateState.status() !== 404) failures.push('Sécurité : les données de la ville ne doivent pas être publiées.');

            // La ville publique doit proposer une vue 3D légère ou conserver son repli 2D.
            const cityDemo = await page.goto('http://127.0.0.1:4173/site/ville-demo.html', {waitUntil: 'domcontentloaded'});
            if (!cityDemo || !cityDemo.ok()) {
              failures.push('Ville : démonstration publique inaccessible.');
            } else {
              const view3dButton = page.locator('#view-3d');
              await view3dButton.click();
              const webglUnavailable = await view3dButton.isDisabled();
              const view3dVisible = await page.locator('#city-view-3d').isVisible();
              const view2dVisible = await page.locator('#city-view').isVisible();
              if (!webglUnavailable && !view3dVisible) failures.push('Ville : le mode WebGL 3D ne s’affiche pas.');
              if (webglUnavailable && !view2dVisible) failures.push('Ville : le repli 2D a disparu sans WebGL.');
              await page.locator('#view-2d').click();
              if (!(await page.locator('#city-view').isVisible())) failures.push('Ville : retour à la vue 2D impossible.');
            }

            // Vérifie l'atelier public : génération locale d'un ZIP Godot, sans téléversement.
            const workshop = await page.goto('http://127.0.0.1:4173/site/atelier.html', {waitUntil: 'domcontentloaded'});
            if (!workshop || !workshop.ok()) {
              failures.push('Atelier : page de création inaccessible.');
            } else {
              await page.locator('#project-name').fill('BrowserDemo3D');
              await page.locator('#template').selectOption('godot-3d');
              await page.locator('#generate').click();
              const generated = await page.evaluate(() => ({
                signature: window.__nexoraLastZipBytes,
                files: window.__nexoraLastFiles,
                status: document.querySelector('#status')?.textContent || ''
              }));
              if (JSON.stringify(generated.signature) !== JSON.stringify([80, 75, 3, 4])) {
                failures.push('Atelier : signature ZIP invalide.');
              }
              if (!generated.files?.includes('BrowserDemo3D/project.godot') ||
                  !generated.files?.includes('BrowserDemo3D/scripts/main.gd')) {
                failures.push('Atelier : fichiers Godot 3D manquants dans le ZIP.');
              }
              if (!generated.status.includes('ZIP')) failures.push('Atelier : confirmation de génération absente.');
              await page.selectOption('#language', 'ar');
              const workshopLanguage = await page.evaluate(() => ({
                lang: document.documentElement.lang,
                dir: document.documentElement.dir
              }));
              if (workshopLanguage.lang !== 'ar' || workshopLanguage.dir !== 'rtl') {
                failures.push('Atelier : traduction arabe ou direction RTL incorrecte.');
              }
              await page.locator('#project-name').fill('../invalid');
              await page.locator('#generate').click();
              if (!(await page.locator('#status').innerText()).includes('غير صالح')) {
                failures.push('Atelier : nom de projet dangereux non rejeté.');
              }
            }

            // Vérifie réellement le mode hors ligne de l'application (service worker).
            const pwaContext = await browser.newContext({serviceWorkers: 'allow'});
            const pwaPage = await pwaContext.newPage();
            const pwaHome = await pwaPage.goto('http://127.0.0.1:4173/site/index.html', {waitUntil: 'load', timeout: 15000});
            if (!pwaHome || !pwaHome.ok()) {
              failures.push('PWA : accueil impossible à charger.');
            } else {
              await pwaPage.evaluate(async () => {
                await Promise.race([
                  navigator.serviceWorker.ready,
                  new Promise((_, reject) => setTimeout(() => reject(new Error('Service worker ready timeout')), 10000))
                ]);
              });
              await pwaPage.reload({waitUntil: 'load', timeout: 15000});
              const controlled = await pwaPage.evaluate(() => Boolean(navigator.serviceWorker.controller));
              if (!controlled) {
                failures.push('PWA : le service worker ne contrôle pas la page.');
              } else {
                await pwaContext.setOffline(true);
                const cachedPage = await pwaPage.goto('http://127.0.0.1:4173/site/methode.html', {waitUntil: 'domcontentloaded', timeout: 10000});
                if (!cachedPage || !cachedPage.ok()) failures.push('PWA : page de méthode inaccessible hors ligne.');
                const offlineFallback = await pwaPage.goto('http://127.0.0.1:4173/site/page-non-cachee-test.html', {waitUntil: 'domcontentloaded', timeout: 10000});
                if (!offlineFallback || !offlineFallback.ok() || !(await pwaPage.locator('body').innerText()).includes('Connexion indisponible')) {
                  failures.push('PWA : page de secours hors ligne non affichée.');
                }
                await pwaContext.setOffline(false);
              }
            }
            await pwaContext.close();

            await browser.close();
            console.log('Pages HTML testées : ' + files.length);
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exit(1);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Parcours utilisateurs synthétiques sur mobile, tablette et ordinateur
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: node scripts/test_site_responsive.js
