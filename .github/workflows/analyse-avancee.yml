name: Analyse avancée - sécurité, qualité et site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyse-avancee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite-python:
    name: Qualité Python (Ruff et Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Installer les analyseurs
        run: python -m pip install --disable-pip-version-check ruff bandit
      - name: Appliquer uniquement les corrections automatiques sûres de Ruff
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ruff check --fix --show-fixes . || true
          git diff --check
      - name: Enregistrer les corrections sûres
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -- '*.py'
            git commit -m "Apply safe automatic Ruff fixes"
            git push
          fi
      - name: Analyser le style et les erreurs Python
        continue-on-error: true
        run: ruff check . --output-format=github
      - name: Analyser les risques de sécurité Python
        continue-on-error: true
        run: bandit -r . -x ./tests -ll

  secrets:
    name: Recherche de secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scanner l'historique Git et les fichiers
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  codeql:
    name: Analyse de sécurité CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']
    steps:
      - uses: actions/checkout@v6
      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyser le code
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  test-site:
    name: Test navigateur de toutes les pages HTML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Installer Playwright
        run: |
          npm install --prefix /tmp/pw --no-audit --no-fund playwright
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Démarrer le site et tester les pages
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/site-server.log 2>&1 &
          echo $! > /tmp/site-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          function htmlFiles(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              if (entry.name === '.git' || entry.name === 'node_modules') return [];
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) return htmlFiles(full);
              return entry.isFile() && entry.name.toLowerCase().endsWith('.html') ? [full] : [];
            });
          }

          (async () => {
            const files = htmlFiles('.');
            if (!files.length) throw new Error('Aucun fichier HTML trouvé.');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const failures = [];
            page.on('pageerror', error => failures.push('Erreur JavaScript: ' + error.message));

            for (const file of files) {
              const route = '/' + file.split(path.sep).join('/');
              const response = await page.goto('http://127.0.0.1:4173' + route, { waitUntil: 'domcontentloaded' });
              if (!response || response.status() >= 400) {
                failures.push(route + ' : HTTP ' + (response ? response.status() : 'aucune réponse'));
              } else {
                const title = await page.title();
                console.log('OK ' + route + ' | ' + (title || 'sans titre'));
                const links = await page.locator('a[href]').evaluateAll(nodes =>
                  nodes.map(node => node.getAttribute('href')).filter(Boolean)
                );
                for (const href of links) {
                  if (href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) continue;
                  const target = new URL(href, page.url());
                  if (target.origin !== 'http://127.0.0.1:4173') continue;
                  const check = await page.request.get(target.href);
                  if (!check.ok()) failures.push(route + ' : lien cassé ' + href + ' (HTTP ' + check.status() + ')');
                }
              }
            }

            // Vérifications fonctionnelles des données et interactions.
            const home = await page.goto('http://127.0.0.1:4173/site/index.html', { waitUntil: 'networkidle' });
            if (!home || !home.ok()) failures.push('Accueil : impossible à charger.');
            await page.waitForFunction(() => {
              const status = document.querySelector('#status');
              return status && status.textContent !== 'Chargement…';
            }, { timeout: 10000 }).catch(() => failures.push('Accueil : les actualités ne terminent pas leur chargement.'));
            const articleData = await page.request.get('http://127.0.0.1:4173/site/articles.json');
            if (!articleData.ok()) {
              failures.push('Actualités : site/articles.json inaccessible.');
            } else {
              const articles = await articleData.json();
              const displayed = await page.locator('#count').textContent();
              if (Number(displayed) !== articles.length) failures.push('Actualités : compteur différent du nombre d’articles.');
              for (const article of articles) {
                if (!article.audio_url) continue;
                let audioPath = String(article.audio_url).replace(/^\.\//, '');
                if (audioPath.startsWith('site/')) audioPath = audioPath.slice(5);
                const audioResponse = await page.request.get('http://127.0.0.1:4173/site/' + audioPath);
                if (!audioResponse.ok()) failures.push('Audio inaccessible : ' + audioPath + ' (HTTP ' + audioResponse.status() + ')');
              }
            }

            const city = await page.goto('http://127.0.0.1:4173/site/ville-virtuelle.html', { waitUntil: 'networkidle' });
            if (!city || !city.ok()) failures.push('Ville virtuelle : page inaccessible.');
            await page.waitForFunction(() => document.querySelector('#connection')?.textContent === 'Données enregistrées chargées', { timeout: 10000 })
              .catch(() => failures.push('Ville virtuelle : données gouvernementales non chargées.'));
            await page.locator('#profiles').waitFor({ state: 'visible' });
            await page.locator('#agent-profiles').waitFor({ state: 'visible' });
            const profileCountText = await page.locator('#profiles').textContent();
            const profileListText = await page.locator('#agent-profiles').innerText();
            if (profileCountText && !profileCountText.includes('0') && !profileListText.includes('non exécuté')) {
              failures.push('Ville virtuelle : les profils IA ne sont pas clairement marqués comme configurés et non exécutés.');
            }
            const canvas = await page.locator('#world').evaluate(el => ({ width: el.width, height: el.height, box: el.getBoundingClientRect().toJSON() }));
            if (canvas.width < 1 || canvas.height < 1 || canvas.box.width < 1 || canvas.box.height < 1) failures.push('Ville virtuelle : canvas non visible ou sans dimensions.');
            const pause = page.locator('#pause');
            await pause.click();
            if ((await pause.textContent()).trim() !== "Reprendre l'animation") failures.push('Ville virtuelle : bouton pause inopérant.');
            await pause.click();
            if ((await pause.textContent()).trim() !== "Mettre l'animation en pause") failures.push('Ville virtuelle : bouton reprise inopérant.');
            await page.locator('#refresh').click();
            await page.waitForFunction(() => document.querySelector('#connection')?.textContent === 'Données enregistrées chargées', { timeout: 10000 })
              .catch(() => failures.push('Ville virtuelle : actualisation des données en échec.'));

            await browser.close();
            console.log('Pages HTML testées : ' + files.length);
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exit(1);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
