name: Maintenance Hebdo, Docu & Nettoyage
on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hebdo-evolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les outils
        run: pip install yt-dlp groq huggingface_hub edge-tts requests
      - name: Evolution Architecte
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -c "from agent_architecte import creer_nouvel_agent_autonome; creer_nouvel_agent_autonome()"
      - name: Documentaire 20 minutes
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python video_longue.py
      - name: Nettoyage auto des MP3 de plus de 90 jours
        run: find . -maxdepth 1 -name "flash_*.mp3" -type f -mtime +90 -delete
      - name: Sauvegarder les nouveaux agents et fichiers
        run: |
          git config --global user.name "Observatoire IA"
          git config --global user.email "bot@github.com"
          git add .
          git commit -m "Evolution hebdomadaire, documentaire et nettoyage" || exit 0
          git push
