name: Traduction progressive des archives publiques

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: publication-depot
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Vérifier les tests et traduire un petit lot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER_ORDER: groq
        run: |
          python -m unittest tests.test_article_translation_backfill tests.test_main
          python traduire_archives.py
      - name: Publier les traductions disponibles
        run: |
          if git diff --quiet -- site/articles.json; then
            echo "Aucune nouvelle traduction disponible."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/articles.json
          git commit -m "Traduire progressivement les archives publiques"
          git pull --rebase origin main
          git push
